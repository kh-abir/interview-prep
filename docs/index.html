<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Senior & Staff Backend Developer — Interview Prep Knowledge Base</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Exhaustive Senior & Staff Backend Developer Interview Preparation Documentation — 14 Modules, 44 In-Depth Guides.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Docsify Theme & Dark/Light Switcher -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <!-- Sidebar Collapse Styles -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">

  <!-- In-Page Right TOC Styles -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-plugin-toc@latest/dist/light.css">

  <style>
    :root {
      --docsify-example-panels-document-width: 100%;
      --theme-color: #10b981;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* Content Layout */
    .markdown-section {
      max-width: 1020px;
      padding: 36px 48px;
      font-size: 15.5px;
      line-height: 1.75;
    }

    .markdown-section h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--borderColor);
    }

    .markdown-section h2 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2.2rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--borderColor);
    }

    .markdown-section h3 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 1.8rem;
      margin-bottom: 0.6rem;
    }

    .markdown-section h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 1.4rem;
    }

    /* Code Blocks & Inline Code */
    .markdown-section code {
      font-family: 'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace !important;
    }

    .markdown-section pre {
      border-radius: 8px !important;
      border: 1px solid var(--borderColor) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      margin: 1.4rem 0 !important;
    }

    .markdown-section pre>code {
      font-size: 13.5px !important;
      line-height: 1.55 !important;
      padding: 18px 20px !important;
    }

    .markdown-section :not(pre) > code {
      font-size: 0.88em !important;
      padding: 2.5px 6px !important;
      border-radius: 4px;
      background: var(--codeBackgroundColor) !important;
      color: var(--codeTextColor) !important;
      border: 1px solid var(--borderColor);
    }

    /* Enhanced Tables */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse;
      margin: 24px 0 !important;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--borderColor);
      font-size: 14px;
    }

    .markdown-section th {
      background: var(--codeBackgroundColor);
      color: var(--textColor);
      font-weight: 700;
      padding: 12px 14px;
      border-bottom: 2px solid var(--borderColor);
      text-align: left;
    }

    .markdown-section td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--borderColor);
      color: var(--textColor);
    }

    .markdown-section tr:nth-child(even) td {
      background: rgba(128, 128, 128, 0.04);
    }

    /* Blockquotes & Callouts */
    .markdown-section blockquote {
      border-left: 4px solid var(--accent) !important;
      background: rgba(16, 185, 129, 0.07);
      padding: 14px 18px !important;
      border-radius: 0 8px 8px 0;
      margin: 18px 0 !important;
      color: var(--textColor);
    }

    .markdown-section blockquote p {
      margin: 4px 0;
    }

    /* Left Sidebar Styling */
    .sidebar {
      font-size: 14px;
      padding-top: 15px;
      border-right: 1px solid var(--borderColor) !important;
    }

    .sidebar-nav {
      padding: 0 16px 40px 16px;
    }

    .sidebar-nav ul {
      margin: 0;
      padding-left: 12px;
    }

    .sidebar-nav > ul {
      padding-left: 0;
    }

    .sidebar-nav li {
      margin: 4px 0;
      line-height: 1.5;
    }

    .sidebar-nav li a {
      font-size: 13.5px;
      color: var(--sidebarSublink);
      transition: all 0.15s ease;
      text-decoration: none;
      display: block;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .sidebar-nav li a:hover {
      color: var(--accent) !important;
      background: rgba(16, 185, 129, 0.08);
    }

    .sidebar-nav li.active > a {
      color: var(--accent) !important;
      font-weight: 600 !important;
      background: rgba(16, 185, 129, 0.12);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding-left: 10px;
    }

    /* Collapsible Folder Chevron Enhancement */
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file)::before {
      border-color: var(--sidebarSublink) !important;
      border-width: 2px !important;
      width: 5px !important;
      height: 5px !important;
      top: 11px !important;
      left: -13px !important;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
    }

    .sidebar-nav ul:not(.app-sub-sidebar) > li.open::before {
      transform: rotate(45deg) !important;
      border-color: var(--accent) !important;
    }

    .sidebar-nav ul:not(.app-sub-sidebar) > li.collapse::before {
      transform: rotate(-45deg) !important;
    }

    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder > strong,
    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder {
      cursor: pointer;
      user-select: none;
    }

    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder > strong {
      font-size: 13.5px;
      color: var(--textColor);
      display: inline-block;
      padding: 4px 0;
    }

    /* Search Box Enhancement */
    .search {
      padding: 14px 16px 10px 16px !important;
      border-bottom: 1px solid var(--borderColor) !important;
      margin-bottom: 10px;
    }

    .search .input-wrap {
      position: relative;
      margin: 0 !important;
    }

    .search input {
      font-family: inherit;
      font-size: 13px;
      border-radius: 8px !important;
      padding: 8px 30px 8px 12px !important;
      background: var(--codeBackgroundColor) !important;
      border: 1px solid var(--borderColor) !important;
      color: var(--textColor) !important;
      width: 100% !important;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25) !important;
      outline: none;
    }

    .search .clear-button {
      right: 8px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
    }

    .search .matching-post {
      border-bottom: 1px solid var(--borderColor);
      padding: 10px 0;
    }

    .search .matching-post h2 {
      font-size: 14px;
      margin: 0 0 4px 0;
      border: none;
      padding: 0;
    }

    .search .matching-post p {
      font-size: 12px;
      line-height: 1.4;
      color: var(--sidebarSublink);
    }

    /* Right-Side In-Page TOC (docsify-plugin-toc) */
    @media only screen and (max-width: 1280px) {
      aside.toc-nav {
        display: none !important;
      }
      section.content {
        padding-right: 0 !important;
      }
    }

    @media only screen and (min-width: 1281px) {
      section.content {
        padding-right: 260px !important;
      }
      aside.toc-nav {
        display: block !important;
        position: fixed;
        top: 75px;
        right: 24px;
        width: 240px;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding-left: 14px;
        background: transparent !important;
        border-left: 1px solid var(--borderColor, rgba(255, 255, 255, 0.1));
        z-index: 90;
      }
    }

    .page_toc {
      position: relative;
      margin: 0;
      border: none;
    }

    .page_toc p.title {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--blockQuoteColor, #8b949e);
      margin: 0 0 10px 0;
      padding: 0;
    }

    .page_toc div {
      border-left: 2px solid transparent !important;
      padding: 3px 0 3px 6px !important;
      margin: 2px 0;
      text-indent: 0 !important;
      cursor: pointer;
    }

    .page_toc div a {
      font-size: 12.5px !important;
      line-height: 1.4 !important;
      color: var(--sidebarSublink, #8b949e) !important;
      text-decoration: none;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .page_toc div a:hover {
      color: var(--accent, #10b981) !important;
    }

    .page_toc div.active {
      border-left-color: var(--accent, #10b981) !important;
    }

    .page_toc div.active a span {
      color: var(--accent, #10b981) !important;
      font-weight: 600;
    }

    .page_toc div.lv3 {
      padding-left: 14px !important;
      font-size: 11.5px !important;
    }

    /* Back to Top Button */
    .back-top {
      background-color: var(--codeBackgroundColor) !important;
      color: var(--textColor) !important;
      border: 1px solid var(--borderColor) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25) !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .back-top:hover {
      border-color: var(--accent) !important;
      color: var(--accent) !important;
    }

    /* Smooth Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--borderColor);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--sidebarSublink);
    }
  </style>
</head>

    // Keyboard shortcut UX: Press '/' to focus search, 'Escape' to blur/clear

      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        var searchInput = document.querySelector('.search input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      } else if (e.key === 'Escape') {
        var searchInput = document.querySelector('.search input');
        if (searchInput && document.activeElement === searchInput) {

          searchInput.dispatchEvent(new Event('input', { bubbles: true }));
