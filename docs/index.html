        codeFontFamily: 'JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace',
        bodyFontSize: '15.5px',
        dark: {
          accent: '#10b981',
          toogleBackground: '#ffffff',
          background: '#0d1117',
          textColor: '#e6edf3',
          codeTextColor: '#f0f6fc',
          codeBackgroundColor: '#161b22',
          borderColor: '#30363d',
          blockQuoteColor: '#8b949e',
          highlightColor: '#f59e0b',
          sidebarSublink: '#8b949e'
        },
        light: {
          accent: '#059669',
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#1f2328',
          codeTextColor: '#24292f',
          codeBackgroundColor: '#f6f8fa',
          borderColor: '#d0d7de',
          blockQuoteColor: '#656d76',
          highlightColor: '#d97706',
          sidebarSublink: '#57606a'
        }
      },
      plugins: [
        function(hook, vm) {
          // Setup collapsible navigation folders on each route change
          hook.doneEach(function() {
            setupCollapsibleNavigation();
          });

          // Setup initial interactive listeners once Docsify is ready
          hook.ready(function() {
            setupBackToTop();
            setupBackdrop();
          });
        }
      ]
    };

    // Collapsible Navigation Folder Logic
    function setupCollapsibleNavigation() {
      var sidebarNav = document.querySelector('.sidebar-nav');
      if (!sidebarNav) return;

      var items = sidebarNav.querySelectorAll('li');
      items.forEach(function(li) {
        var subUl = li.querySelector('ul');
        if (!subUl) {
          li.classList.add('nav-file');
          return;
        }

        li.classList.add('nav-folder');
        var header = li.querySelector('strong') || li.querySelector('p') || li.firstElementChild;

        if (header && !header.dataset.hasCollapseListener) {
          header.dataset.hasCollapseListener = 'true';
          header.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            li.classList.toggle('folder-open');
          });
        }
      });

      // Auto-open active route's folder
      var hash = decodeURIComponent(location.hash);
      var cleanHash = hash.replace(/\.md$/, '');
      var activeLink = sidebarNav.querySelector('a[href="' + hash + '"]') ||
                       sidebarNav.querySelector('a[href="' + cleanHash + '"]') ||
                       sidebarNav.querySelector('a.active') ||
                       sidebarNav.querySelector('.active a');

      if (activeLink) {
        var parent = activeLink.parentElement;
        while (parent && parent !== sidebarNav) {
          if (parent.classList.contains('nav-folder')) {
            parent.classList.add('folder-open');
          }
          parent = parent.parentElement;
        }
      }

      // Close mobile drawer when an article link is clicked
      sidebarNav.addEventListener('click', function(e) {
        var a = e.target.tagName === 'A' ? e.target : e.target.closest('a');
        if (a) {
          if (window.innerWidth <= 768) {
            document.body.classList.remove('close');
          }
        }
      });
    }

    // Mobile Backdrop Dimmer Logic
    function setupBackdrop() {
      var backdrop = document.getElementById('sidebar-backdrop');
      if (backdrop) {
        backdrop.addEventListener('click', function() {
          document.body.classList.remove('close');
        });
      }

      // Stop propagation on sidebar clicks so interacting with search or folders doesn't close drawer
      var sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        sidebar.addEventListener('click', function(e) {
          if (e.target.tagName !== 'A' && !e.target.closest('a')) {
            e.stopPropagation();
          }
        });
      }
    }

    // Bulletproof Back-to-Top Button Logic
    function setupBackToTop() {
      var btn = document.getElementById('custom-back-top');
      if (!btn) return;

      function onScroll() {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        if (scrollY > 280) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      document.addEventListener('scroll', onScroll, { passive: true });

      btn.addEventListener('click', function(e) {
        e.preventDefault();
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      });

      onScroll();
    }

    // Keyboard Shortcuts: Press '/' to focus search, 'Escape' to clear/blur
    window.addEventListener('keydown', function(e) {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        var searchInput = document.querySelector('.search input');
        if (searchInput) {
          // If sidebar closed on mobile, open it first
          if (window.innerWidth <= 768 && !document.body.classList.contains('close')) {
            document.body.classList.add('close');
          }
          searchInput.focus();
          searchInput.select();
        }
      } else if (e.key === 'Escape') {
        var searchInput = document.querySelector('.search input');
        if (searchInput && document.activeElement === searchInput) {
          searchInput.value = '';
          searchInput.dispatchEvent(new Event('input', { bubbles: true }));
          searchInput.blur();
        }
      }
    });
  </script>
